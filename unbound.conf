# unbound.conf — tuned for the Shopify domain finder
#
# Drop-in replacement for the stock config that ships with the Windows
# installer (usually C:\Program Files\Unbound\service.conf). Back up the
# original first, then restart the Unbound service.
#
# Why the stock config is not enough: it is sized for a home router doing a
# handful of lookups a second. This workload does ~1,500/sec of *unique*
# domains, so almost nothing is cache-served and every query is a full
# recursive walk. Default outgoing-range and num-queries-per-thread throttle
# that hard.
#
# Sizing assumes a many-core desktop with RAM to spare. On the machine this
# was written for (i9-12900K, 32 GB) it uses roughly 5-10% of one core and
# ~300 MB.

server:
    # ---- listen only on this machine -------------------------------------
    interface: 127.0.0.1
    port: 53
    do-ip4: yes
    do-ip6: no                  # no IPv6 path needed; halves the query fan-out
    do-udp: yes
    do-tcp: yes
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse

    # ---- concurrency -----------------------------------------------------
    # num-threads: keep well under core count; DNS is IO-bound, not CPU-bound.
    num-threads: 4

    # outgoing-range is the number of ports each thread can have in flight.
    # This is ALSO the safety valve for your router: 4 threads x 940 = ~3,760
    # concurrent outbound flows maximum, which bounds NAT table pressure no
    # matter what the scanner asks for. Lower this first if other devices on
    # the network get flaky while scanning.
    outgoing-range: 940
    num-queries-per-thread: 470

    # Windows has no ulimit; this just needs to exceed outgoing-range x threads
    outgoing-port-permit: 10240-65535

    # ---- caches ----------------------------------------------------------
    # Unique-domain workload, so hit rates are low -- but negative caching
    # (NXDOMAIN) matters a lot here: ~10% of the ranks feed is dead domains
    # and we do not want to re-walk the tree for each one.
    msg-cache-size: 128m
    rrset-cache-size: 256m
    msg-cache-slabs: 8
    rrset-cache-slabs: 8
    infra-cache-slabs: 8
    key-cache-slabs: 8
    cache-min-ttl: 300
    cache-max-ttl: 86400
    cache-max-negative-ttl: 3600
    neg-cache-size: 64m

    # ---- latency ---------------------------------------------------------
    # Do not spend time on a nameserver that is not answering; this workload
    # would rather fail fast and requeue than block a concurrency slot.
    infra-host-ttl: 900
    infra-keep-probing: yes
    serve-expired: yes
    serve-expired-ttl: 3600
    prefetch: yes
    prefetch-key: yes
    minimal-responses: yes      # smaller packets, less parsing
    qname-minimisation: no      # privacy feature; costs an extra round trip

    # ---- correctness -----------------------------------------------------
    harden-dnssec-stripped: yes
    harden-glue: yes
    # DNSSEC validation adds CPU and latency. The finder only needs A records
    # to decide "is this in Shopify's IP range", and a spoofed answer would
    # simply fail the HTTP verification step afterwards. Left off for speed;
    # turn it on if you use this resolver for general browsing too.
    # auto-trust-anchor-file: "C:\Program Files\Unbound\root.key"

    # ---- noise -----------------------------------------------------------
    verbosity: 0
    log-queries: no
    statistics-interval: 0

    # Windows service specifics
    chroot: ""
    directory: "C:\Program Files\Unbound"
    username: ""

remote-control:
    control-enable: no
